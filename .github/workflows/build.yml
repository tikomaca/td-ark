name: Build TDLib for Android

on:
  workflow_dispatch:
    inputs:
      td_ref:
        description: "Branch, tag or commit of tdlib/td"
        default: "master"
      abis:
        description: "ABIs (space separated)"
        default: "arm64-v8a"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ inputs.td_ref }}
          path: td

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf php-cli cmake g++ ccache unzip wget perl

      - name: Check environment
        working-directory: td/example/android
        run: ./check-environment.sh

      - name: Fetch Android SDK
        working-directory: td/example/android
        run: ./fetch-sdk.sh

      - name: Build OpenSSL
        working-directory: td/example/android
        run: ./build-openssl.sh

      - name: Build TDLib
        working-directory: td/example/android
        run: ./build-tdlib.sh '' '' '' '' '' '' '${{ inputs.abis }}'

      - name: Show output
        working-directory: td/example/android
        run: |
          ls -la tdlib
          ls -R tdlib/libs | head -50
          ls -R tdlib/java | head -50

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android
          path: |
            td/example/android/tdlib/libs
            td/example/android/tdlib/java
            td/example/android/tdlib/tdlib.zip
