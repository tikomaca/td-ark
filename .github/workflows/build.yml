name: Build TDLib for Android

on:
  workflow_dispatch:
    inputs:
      td_ref:
        description: "Branch, tag or commit of tdlib/td"
        default: "master"
      abis:
        description: "ABIs (space separated)"
        default: "arm64-v8a"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ inputs.td_ref }}
          path: td

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf php-cli cmake g++ ccache

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "cmake;3.22.1" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Show script usage (for debugging)
        working-directory: td/example/android
        run: |
          echo "=== README ==="
          cat README.md || true
          echo "=== build-openssl.sh (head) ==="
          sed -n '1,30p' build-openssl.sh || true
          echo "=== build-tdlib.sh (head) ==="
          sed -n '1,30p' build-tdlib.sh || true

      - name: Build TDLib (Java + JNI)
        working-directory: td/example/android
        run: |
          ./check-environment.sh
          ./fetch-sdk.sh
          ./build-openssl.sh "$ANDROID_HOME" "$ANDROID_NDK_ROOT" "$ANDROID_HOME/ndk/openssl" 21 ${{ inputs.abis }}
          ./build-tdlib.sh "$ANDROID_HOME" "$ANDROID_NDK_ROOT" "$ANDROID_HOME/ndk/openssl" 21 ${{ inputs.abis }}

      - name: Collect output
        run: |
          mkdir -p out
          cp -r td/example/android/tdlib/* out/ || true
          cd td && git rev-parse HEAD > ../out/TDLIB_COMMIT.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android
          path: out/
